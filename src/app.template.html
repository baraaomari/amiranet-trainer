<title>مدرّب أميرنت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Poppins:wght@400;500;600;700&display=swap">

<style>
/* ───────── tokens ───────── */
:root{
  color-scheme: light;
  --bg:#F1F2F4;
  --surface:#FFFFFF;
  --surface-2:#F7F8F9;
  --ink:#15171B;          /* الملء القوي — الأسود في التصميم */
  --on-ink:#FFFFFF;
  --text:#15171B;
  --muted:#8E9299;
  --line:#E6E8EC;
  --hatch:#E2E4E8;

  --c-butter:#F7E6A4;
  --c-sage:#D2E2DA;
  --c-lilac:#DAD4F0;
  --c-blush:#F7DBE4;
  --on-pastel:#15171B;
  --scribble:#FFFFFF;
  --scribble-a:.55;

  --good:#2C7A4B;  --good-bg:#DCEFE3;
  --bad:#C0392F;   --bad-bg:#F9DFDB;
  --warn:#9E5E10;  --warn-bg:#FAEBD5;

  --r-xl:32px; --r-lg:26px; --r-md:18px; --r-sm:12px; --r-pill:999px;
  --shadow:0 2px 10px rgba(20,22,26,.05);
  --shadow-lift:0 10px 26px rgba(20,22,26,.14);
  --font:'Poppins','Almarai',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131417; --surface:#1C1E22; --surface-2:#232529;
    --ink:#EFF0F2; --on-ink:#15171B;
    --text:#ECEDEF; --muted:#8B9097; --line:#2C2F35; --hatch:#282B31;
    --c-butter:#4B4327; --c-sage:#28382F; --c-lilac:#332E4A; --c-blush:#432C34;
    --on-pastel:#ECEDEF; --scribble:#FFFFFF; --scribble-a:.10;
    --good:#63C88C; --good-bg:#1E3A2A;
    --bad:#F0837A;  --bad-bg:#3B2422;
    --warn:#E0A24A; --warn-bg:#3A2E1B;
    --shadow:0 2px 10px rgba(0,0,0,.35);
    --shadow-lift:0 10px 26px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131417; --surface:#1C1E22; --surface-2:#232529;
  --ink:#EFF0F2; --on-ink:#15171B;
  --text:#ECEDEF; --muted:#8B9097; --line:#2C2F35; --hatch:#282B31;
  --c-butter:#4B4327; --c-sage:#28382F; --c-lilac:#332E4A; --c-blush:#432C34;
  --on-pastel:#ECEDEF; --scribble:#FFFFFF; --scribble-a:.10;
  --good:#63C88C; --good-bg:#1E3A2A;
  --bad:#F0837A;  --bad-bg:#3B2422;
  --warn:#E0A24A; --warn-bg:#3A2E1B;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --shadow-lift:0 10px 26px rgba(0,0,0,.5);
}

/* ───────── base ───────── */
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.02em; line-height:1.15}
p{margin:0}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.en{direction:ltr; unicode-bidi:isolate; text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{
  direction:rtl; max-width:560px; margin:0 auto;
  padding:20px 18px calc(120px + env(safe-area-inset-bottom));
  min-height:100vh;
}

/* ───────── header ───────── */
.top{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:none; border:0; cursor:pointer;
  background:var(--c-lilac); color:var(--on-pastel);
  display:grid;place-items:center; font-weight:700; font-size:19px;
  box-shadow:var(--shadow);
}
.top-name{font-size:23px; font-weight:700; letter-spacing:-.03em}
.top-sub{color:var(--muted); font-size:13px; margin-top:-2px}
.icon-btn{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:var(--surface); color:var(--text);
  display:grid;place-items:center; box-shadow:var(--shadow);
  transition:transform .15s;
}
.icon-btn:hover{transform:scale(1.06)}
.icon-btn.solid{background:var(--ink); color:var(--on-ink)}
.lang-btn{width:auto; padding:0 15px; font-size:12.5px; font-weight:600; letter-spacing:.01em}

/* ───────── generic ───────── */
.card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; align-items:center; gap:10px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:26px 2px 12px}
.sec-head h2{font-size:20px}
.link{color:var(--muted); font-size:13px; font-weight:500}
.link:hover{color:var(--text)}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted);
}
.page-title{font-size:38px; font-weight:700; letter-spacing:-.04em; line-height:1.05; margin:6px 2px 22px}
.page-title.sm{font-size:30px}

.pills{display:flex; gap:9px; margin-bottom:18px; overflow-x:auto; padding:2px; scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  padding:11px 20px; border-radius:var(--r-pill); background:var(--surface);
  font-size:13.5px; font-weight:500; white-space:nowrap; box-shadow:var(--shadow);
  transition:background .15s,color .15s;
}
.pill[aria-selected="true"]{background:var(--ink); color:var(--on-ink); font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 24px; border-radius:var(--r-pill); font-weight:600; font-size:15px;
  background:var(--ink); color:var(--on-ink); transition:transform .15s, opacity .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
.btn.ghost{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.btn.wide{width:100%}
.btn.sm{padding:10px 17px; font-size:13.5px}

.field{
  width:100%; padding:14px 17px; border-radius:var(--r-md);
  background:var(--surface); border:1.5px solid var(--line); color:var(--text);
}
.field:focus{outline:none; border-color:var(--ink)}
label.lbl{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 3px 7px}

.note{
  background:var(--warn-bg); color:var(--warn); border-radius:var(--r-md);
  padding:13px 16px; font-size:12.5px; line-height:1.6; font-weight:500;
}
.empty{text-align:center; color:var(--muted); padding:38px 20px; font-size:14px}

/* ───────── today strip ───────── */
.strip{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px}
.stat{background:var(--surface); border-radius:var(--r-md); padding:14px 12px; text-align:center; box-shadow:var(--shadow)}
.stat b{display:block; font-size:24px; font-weight:700; letter-spacing:-.03em; line-height:1.1}
.stat span{display:block; font-size:11.5px; color:var(--muted); margin-top:3px}

/* ───────── pastel tiles ───────── */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.tile{
  position:relative; isolation:isolate;   /* بدون overflow:hidden — حلقة زر السهم لازم تكسر الحافة */
  border-radius:var(--r-xl); padding:16px 16px 18px;
  min-height:186px; display:flex; flex-direction:column;
  color:var(--on-pastel); text-align:start;
}
.tile.butter{background:var(--c-butter)}
.tile.sage{background:var(--c-sage)}
.tile.lilac{background:var(--c-lilac)}
.tile.blush{background:var(--c-blush)}

.tile-art{
  position:absolute; top:8px; inset-inline-start:6px;
  width:104px; height:70px; z-index:-1;
  color:var(--on-pastel); opacity:.34;
}
:root[data-theme="dark"] .tile-art{opacity:.46}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tile-art{opacity:.46}
}
.tile:hover .tile-art{opacity:.5; transition:opacity .2s}
.tile-badge{
  width:36px;height:36px;border-radius:50%; background:var(--surface); color:var(--text);
  display:grid;place-items:center; flex:none;
}
.tile-title{font-size:21px; font-weight:700; letter-spacing:-.03em; margin-top:auto}
.tile-meta{font-size:12.5px; opacity:.72; margin-top:3px; font-weight:500}

.tile-go{
  position:absolute; inset-inline-end:4px; bottom:82px;
  width:46px;height:46px;border-radius:50%;
  background:var(--ink); color:var(--on-ink);
  display:grid;place-items:center;
  box-shadow:0 0 0 7px var(--bg);
  transition:transform .18s;
}
.tile:hover .tile-go{transform:scale(1.08)}

/* ───────── list rows ───────── */
.rowcard{
  display:flex; align-items:center; gap:13px; width:100%; text-align:start;
  background:var(--surface); border-radius:var(--r-pill); padding:11px 15px 11px 11px;
  box-shadow:var(--shadow);
}
.rowcard.flat{border-radius:var(--r-md)}
.rowcard-ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2)}
.rowcard-ic.sage{background:var(--c-sage);color:var(--on-pastel)}
.rowcard-ic.blush{background:var(--c-blush);color:var(--on-pastel)}
.rowcard-ic.butter{background:var(--c-butter);color:var(--on-pastel)}
.rowcard-ic.lilac{background:var(--c-lilac);color:var(--on-pastel)}
.rowcard b{display:block; font-size:14.5px; font-weight:600}
.rowcard small{display:block; color:var(--muted); font-size:12px}

/* ───────── levels ───────── */
.levels{display:flex; flex-direction:column; gap:13px}
.level{
  position:relative; overflow:hidden; border-radius:var(--r-lg);
  padding:18px 19px; background:var(--surface); box-shadow:var(--shadow);
  display:block; width:100%; text-align:start;
}
.level.open.c0{background:var(--c-butter)}
.level.open.c1{background:var(--c-sage)}
.level.open.c2{background:var(--c-lilac)}
.level.open.c3{background:var(--c-blush)}
.level.open{color:var(--on-pastel)}
.level.locked{opacity:.62}
.level-top{display:flex; align-items:center; gap:11px}
.level-n{
  width:42px;height:42px;border-radius:50%;flex:none; display:grid;place-items:center;
  background:var(--surface); color:var(--text); font-weight:700; font-size:16px;
}
.level.locked .level-n{background:var(--surface-2)}
.level h3{font-size:17px}
.level small{color:var(--muted); font-size:12px; display:block}
.level.open small{color:inherit; opacity:.66}
.bar{height:7px; border-radius:99px; background:rgba(21,23,27,.11); margin-top:14px; overflow:hidden}
:root[data-theme="dark"] .bar,
:root:not([data-theme="light"]) .bar{background:rgba(255,255,255,.13)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .bar{background:rgba(21,23,27,.11)}}
.bar i{display:block; height:100%; border-radius:99px; background:var(--ink); transition:width .4s}
.level-foot{display:flex; align-items:center; justify-content:space-between; margin-top:9px; font-size:12px; font-weight:600}

/* ───────── دائرة التقدّم ───────── */
.ring{flex:none; display:block}
.ring .track{stroke:rgba(21,23,27,.13)}
:root[data-theme="dark"] .ring .track{stroke:rgba(255,255,255,.15)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .ring .track{stroke:rgba(255,255,255,.15)}
}
.ring .bar{transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring text{font-family:var(--font); font-variant-numeric:tabular-nums}
.level.locked .ring{opacity:.45}

/* ───────── التدريب ───────── */
.skill-tile{min-height:150px}
.skill-ring{position:absolute; top:14px; inset-inline-start:14px; color:var(--on-pastel)}
.explain{
  margin-top:14px; background:var(--surface); border-radius:var(--r-lg);
  padding:18px 18px 8px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
}
.ex-row p{font-size:14.5px; line-height:1.8; margin-top:4px}
.ex-opt{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:13.5px; line-height:1.7;
  border-top:1px solid var(--line)}
.ex-opt:first-of-type{border-top:0}
.ex-opt .opt-k{flex:none; width:24px; height:24px; font-size:11.5px; margin-top:2px}
.ex-opt.ok{color:var(--good)}
.ex-opt.ok .opt-k{background:var(--good); color:#fff}
.ex-vocab{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; padding-bottom:10px}
.ex-vocab .chip b{color:var(--text); font-weight:600}

/* ───────── flashcard ───────── */
.fc-wrap{display:flex; flex-direction:column; gap:16px}
.fc{
  position:relative; border-radius:var(--r-xl); background:var(--surface);
  box-shadow:var(--shadow); padding:34px 24px; min-height:290px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:14px; cursor:pointer;
}
.fc-word{font-size:40px; font-weight:600; letter-spacing:-.03em; line-height:1.1; word-break:break-word}
.fc-pos{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); background:var(--surface-2); padding:5px 12px; border-radius:var(--r-pill);
}
.fc-ar{font-size:25px; font-weight:700; letter-spacing:-.02em}
.fc-ex{font-size:14.5px; line-height:1.7; color:var(--muted); max-width:38ch}
.fc-ex b{color:var(--text); font-weight:600}
.fc-hint{position:absolute; bottom:16px; font-size:12px; color:var(--muted)}
.fc-syn{display:flex; gap:7px; flex-wrap:wrap; justify-content:center}
.chip{background:var(--surface-2); border-radius:var(--r-pill); padding:5px 13px; font-size:12.5px; color:var(--muted)}
.tag{
  background:var(--c-sage); color:var(--on-pastel); border-radius:var(--r-pill);
  padding:2px 9px; font-size:10.5px; font-weight:600; vertical-align:2px;
}
.fc-box{position:absolute; top:16px; inset-inline-end:18px; font-size:11.5px; color:var(--muted); font-weight:600}
.judge{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.judge button{padding:17px; border-radius:var(--r-lg); font-weight:600; font-size:15px}
.judge .no{background:var(--bad-bg); color:var(--bad)}
.judge .yes{background:var(--good-bg); color:var(--good)}
.progline{height:5px; border-radius:99px; background:var(--line); overflow:hidden}
.progline i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}

/* ───────── questions ───────── */
.q-card{background:var(--surface); border-radius:var(--r-lg); padding:22px 20px; box-shadow:var(--shadow)}
.q-text{font-size:16.5px; line-height:1.75; font-weight:500; margin-bottom:16px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:start;
  padding:14px 16px; border-radius:var(--r-md); background:var(--surface-2);
  border:2px solid transparent; font-size:15px; line-height:1.5; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--ink); background:var(--surface)}
.opt-k{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--surface); font-size:12.5px; font-weight:700; color:var(--muted);
}
.opt[aria-pressed="true"] .opt-k{background:var(--ink); color:var(--on-ink)}
.opt.correct{border-color:var(--good); background:var(--good-bg)}
.opt.correct .opt-k{background:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .opt-k{background:var(--bad); color:#fff}
.passage{
  background:var(--surface-2); border-radius:var(--r-md); padding:18px 19px;
  font-size:15px; line-height:1.85; max-height:290px; overflow-y:auto; margin-bottom:16px;
}
.passage p+p{margin-top:13px}

.plines{direction:ltr; text-align:left}
.pline{display:flex; gap:12px; align-items:baseline}
.pline.gap{margin-top:12px}
.pn{
  flex:0 0 20px; text-align:right; font-size:11.5px; font-weight:600;
  color:var(--muted); user-select:none;
}

.runner-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
.timer{
  display:inline-flex; align-items:center; gap:7px; padding:99px 15px; border-radius:var(--r-pill);
  background:var(--surface); box-shadow:var(--shadow); font-weight:700; font-size:14.5px;
}
.timer.low{background:var(--warn-bg); color:var(--warn)}
.navgrid{display:flex; gap:7px; flex-wrap:wrap; margin-top:16px}
.navgrid button{
  width:34px;height:34px;border-radius:50%; background:var(--surface); box-shadow:var(--shadow);
  font-size:12.5px; font-weight:600;
}
.navgrid button.done{background:var(--c-sage); color:var(--on-pastel)}
.navgrid button.here{background:var(--ink); color:var(--on-ink)}

/* ───────── score ───────── */
.score-hero{
  background:var(--surface); border-radius:var(--r-xl); padding:28px 22px; text-align:center;
  box-shadow:var(--shadow);
}
.score-big{font-size:64px; font-weight:700; letter-spacing:-.05em; line-height:1}
.score-of{font-size:14px; color:var(--muted); margin-top:2px}
.gauge{position:relative; height:12px; border-radius:99px; margin:22px 0 8px;
  background:linear-gradient(90deg,var(--bad-bg),var(--warn-bg),var(--good-bg))}
.gauge i{
  position:absolute; top:50%; width:20px;height:20px;border-radius:50%;
  background:var(--ink); border:3px solid var(--surface); transform:translate(-50%,-50%);
  transition:inset-inline-start .5s;
}
.gauge-ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); font-weight:600}
.band{
  display:inline-block; margin-top:16px; padding:9px 18px; border-radius:var(--r-pill);
  background:var(--c-sage); color:var(--on-pastel); font-weight:600; font-size:14px;
}
.breakdown{display:flex; flex-direction:column; gap:9px; margin-top:16px}
.bd{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13.5px}
.bd-bar{flex:1; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}

/* ───────── calendar ───────── */
.cal{background:var(--surface); border-radius:var(--r-xl); padding:18px 16px 20px; box-shadow:var(--shadow)}
.cal-top{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.cal-mo{font-size:18px; font-weight:700; letter-spacing:-.02em; flex:1}
.cal-mo span{color:var(--muted); font-weight:500}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; justify-items:center}
.cal-dow{font-size:11.5px; color:var(--muted); font-weight:500; padding-bottom:6px}
.cal-d{
  width:100%; aspect-ratio:1; max-width:42px; border-radius:50%;
  display:grid; place-items:center; font-size:13.5px; font-weight:500;
  background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line); position:relative;
}
.cal-d.out{
  background:repeating-linear-gradient(-45deg,var(--hatch) 0 2px,transparent 2px 5px);
  box-shadow:none; color:transparent; pointer-events:none;
}
.cal-d.task{background:var(--c-sage); color:var(--on-pastel); box-shadow:none}
.cal-d.exam{background:var(--c-blush); color:var(--on-pastel); box-shadow:none; font-weight:700}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d.sel{background:var(--ink); color:var(--on-ink); box-shadow:none; font-weight:700}
.cal-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; font-size:11.5px; color:var(--muted)}
.cal-legend i{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-inline-end:5px}

.task{display:flex; align-items:center; gap:12px; background:var(--c-sage); color:var(--on-pastel);
  border-radius:var(--r-md); padding:13px 15px}
.task.done{opacity:.5}
.task.done b{text-decoration:line-through}
.task b{flex:1; font-weight:600; font-size:14.5px}
.task-check{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.task-del{color:inherit; opacity:.5; padding:4px}
.task-del:hover{opacity:1}

/* ───────── tutor ───────── */
.chat{display:flex; flex-direction:column; gap:13px; min-height:180px}
.msg{max-width:86%; padding:14px 17px; border-radius:var(--r-lg); font-size:14.5px; line-height:1.7; white-space:pre-wrap; word-wrap:break-word}
.msg.me{align-self:flex-start; background:var(--ink); color:var(--on-ink); border-bottom-left-radius:8px}
.msg.ai{align-self:flex-end; background:var(--surface); box-shadow:var(--shadow); border-bottom-right-radius:8px}
.msg.err{align-self:flex-end; background:var(--bad-bg); color:var(--bad); font-size:13.5px}
.typing{display:inline-flex; gap:4px; align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25} 30%{opacity:1}}

#s-tutor{padding-bottom:96px}
.composer{
  position:fixed; z-index:15;
  inset-inline:0; bottom:calc(94px + env(safe-area-inset-bottom));
  margin-inline:auto; width:min(524px, calc(100% - 36px));
  display:flex; gap:9px; align-items:flex-end;
  background:var(--surface); border-radius:var(--r-xl); padding:9px; box-shadow:var(--shadow-lift);
}
.composer textarea{
  flex:1; border:0; background:none; resize:none; padding:11px 10px; max-height:110px;
  font-size:15px; line-height:1.5;
}
.composer textarea:focus{outline:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35}
.suggests{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.suggest{background:var(--surface); box-shadow:var(--shadow); border-radius:var(--r-pill); padding:9px 15px; font-size:13px; text-align:start}

/* ───────── حلول الأغلاط عند المدرّس ───────── */
.mistake .rowcard{width:100%; text-align:start}
.mistake-body{display:flex; flex-direction:column; gap:12px; margin-top:12px}
.mistake-body .explain{margin-top:0}
.m-passage{background:var(--surface); border-radius:var(--r-lg); padding:13px 17px; box-shadow:var(--shadow)}
.m-passage summary{cursor:pointer; font-weight:600; font-size:13.5px}
.m-passage .passage{margin-top:10px}

/* ───────── تصفّح الكلمات (زي الريلز) ───────── */
.feed-entry{
  display:flex; align-items:center; gap:14px; width:100%; margin-bottom:18px; padding:15px 17px;
  border-radius:var(--r-lg); background:var(--ink); color:var(--on-ink); text-align:start; box-shadow:var(--shadow-lift);
}
.feed-entry b{display:block; font-size:16px}
.feed-entry small{display:block; font-size:12.5px; opacity:.72; margin-top:2px}
.fe-ic{width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--c-butter); color:var(--on-pastel)}
body.feed-open{overflow:hidden}
.feed{
  position:fixed; inset:0; z-index:15; background:var(--bg);
  overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:none;
}
.feed::-webkit-scrollbar{display:none}

#s-feed::before{content:""; position:fixed; inset:0; z-index:14; background:var(--bg)}
.reel{
  height:100vh; height:var(--reel-h, 100dvh); scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; justify-content:center; color:var(--on-pastel); background:var(--c-butter);
}
.reel.c-sage{background:var(--c-sage)} .reel.c-lilac{background:var(--c-lilac)} .reel.c-blush{background:var(--c-blush)}

.reel-inner{
  position:relative; width:100%; max-width:560px; height:100%; display:flex; align-items:flex-start;
  padding:calc(112px + env(safe-area-inset-top)) 20px 40px;
}
.reel-body{width:100%; text-align:center; padding-inline-start:60px}
.reel .en{text-align:center}
.reel-meta{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:18px}
.reel-tag{
  font-size:11px; font-weight:600; letter-spacing:.05em; padding:5px 12px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--text);
}
.reel-word{font-size:clamp(32px, 11vw, 58px); font-weight:700; letter-spacing:-.035em; line-height:1.05; word-break:break-word}
.reel-ar{display:grid; margin:14px auto 0; min-height:40px}
.reel-ar > span{grid-area:1/1; align-self:center; justify-self:center}
.reel-ar-t{font-size:26px; font-weight:700; letter-spacing:-.02em}
.reel-ar-h{display:none; font-size:13px; font-weight:600; padding:9px 16px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--text)}
.hide-ar .reel:not(.revealed) .reel-ar-t{visibility:hidden}
.hide-ar .reel:not(.revealed) .reel-ar-h{display:block}
.hide-ar .reel:not(.revealed) .reel-ex-ar{filter:blur(6px)}
.reel-ex{margin:22px auto 0; font-size:17px; line-height:1.6; max-width:34ch}
.reel-ex b{font-weight:700; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px}
.reel-ex-ar{margin:8px auto 0; font-size:14.5px; line-height:1.7; opacity:.78; max-width:36ch; transition:filter .2s}
.reel-syn{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:20px}
.reel-syn span{background:var(--surface); color:var(--text); border-radius:var(--r-pill); padding:5px 12px; font-size:12.5px}
.reel-rail{
  position:absolute; inset-inline-start:12px; top:calc(112px + env(safe-area-inset-top));
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.rail-btn{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; font-weight:600}
.rail-ic{
  width:50px; height:50px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface); color:var(--text); box-shadow:var(--shadow-lift); transition:transform .18s, background .18s;
}
.rail-btn:active .rail-ic{transform:scale(.88)}
.rail-btn[data-act="know"].on .rail-ic{background:var(--good); color:#fff}
.rail-btn[data-act="hard"].on .rail-ic{background:var(--bad); color:#fff}
.rail-lock{opacity:.7}
.rail-box{font-size:10.5px; font-weight:600; opacity:.75}
.reel-err{margin-top:26px; font-size:11px; opacity:.6; word-break:break-word}
.reel-swipe{
  display:flex; flex-direction:column; align-items:center; margin-top:34px; font-size:12px; font-weight:600; opacity:.6;
  animation:swipeHint 1.6s ease-in-out infinite; pointer-events:none;
}
@keyframes swipeHint{50%{transform:translateY(-8px)}}
.feed-top{
  position:fixed; z-index:17; top:0; inset-inline:0; margin-inline:auto; max-width:560px;
  display:flex; align-items:center; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 16px 8px;
}
.feed-search{
  flex:1; min-width:0; height:46px; display:flex; align-items:center; gap:8px; padding:0 15px;
  background:var(--surface); color:var(--muted); border-radius:var(--r-pill); box-shadow:var(--shadow);
}
.feed-search input{flex:1; min-width:0; height:100%; border:0; outline:0; background:none; color:var(--text); font-size:14px}
#feedHide[aria-pressed="true"]{background:var(--ink); color:var(--on-ink)}
.feed-count{
  position:fixed; z-index:16; top:calc(72px + env(safe-area-inset-top)); inset-inline:0; margin-inline:auto;
  width:max-content; padding:4px 11px; border-radius:var(--r-pill); background:var(--surface);
  font-size:11.5px; font-weight:600; color:var(--muted); box-shadow:var(--shadow);
}
.feed-results{
  position:fixed; z-index:18; top:calc(66px + env(safe-area-inset-top)); inset-inline:16px; margin-inline:auto;
  max-width:528px; max-height:52vh; overflow-y:auto; padding:6px;
  background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow-lift);
}
.feed-results button{display:flex; align-items:baseline; justify-content:space-between; gap:12px; width:100%;
  padding:11px 12px; border-radius:var(--r-sm); text-align:start}
.feed-results button:hover{background:var(--surface-2)}
.feed-results small{color:var(--muted); font-size:12.5px}
.feed-none{padding:14px; color:var(--muted); font-size:13px; text-align:center}
@media (min-width:620px){ .reel-body{padding-inline:64px} }

/* ───────── تذكيرات الإيميل ───────── */
.email-ask{display:flex; gap:14px; align-items:flex-start; padding:17px 18px; margin:-8px 0 22px}
.email-ask b{display:block; font-size:15.5px}
.email-ask p{color:var(--muted); font-size:13px; line-height:1.7; margin-top:3px}
.email-toggle{display:flex; gap:12px; align-items:flex-start; margin-top:16px; padding-top:14px;
  border-top:1px solid var(--line); cursor:pointer}
.email-toggle input{width:20px; height:20px; margin-top:2px; accent-color:var(--ink); flex:none}
.email-toggle b{display:block; font-size:14px}
.email-toggle small{display:block; color:var(--muted); font-size:12.5px; line-height:1.6}

/* ───────── tabbar ───────── */
.tabbar{
  position:fixed; z-index:20; direction:rtl;
  inset-inline:0; bottom:calc(18px + env(safe-area-inset-bottom));
  margin-inline:auto; width:max-content; max-width:calc(100% - 28px);
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border-radius:var(--r-pill);
  padding:9px 11px; box-shadow:var(--shadow-lift);
}
.tab{
  width:50px;height:50px;border-radius:50%; display:grid;place-items:center;
  background:var(--surface-2); color:var(--muted);
  transition:transform .22s cubic-bezier(.34,1.4,.5,1), background .18s, color .18s;
}
.tab[aria-current="page"]{
  background:var(--ink); color:var(--on-ink);
  width:62px;height:62px; transform:translateY(-15px);
  box-shadow:0 0 0 7px var(--bg), var(--shadow-lift);
}
/* ───────── بوابة الحساب ───────── */
.auth{
  position:fixed; inset:0; z-index:60; background:var(--bg);
  display:grid; place-items:center; padding:24px; overflow-y:auto;
}
.auth-card{
  width:100%; max-width:400px; background:var(--surface); border-radius:var(--r-xl);
  padding:34px 26px 26px; box-shadow:var(--shadow-lift); text-align:center;
}
.auth-brand{
  width:60px;height:60px;border-radius:50%; margin:0 auto 16px;
  background:var(--c-lilac); display:grid; place-items:center; font-size:28px;
}
.auth-title{font-size:26px; letter-spacing:-.03em}
.auth-sub{color:var(--muted); font-size:13.5px; margin:6px 0 20px; line-height:1.6}
.auth form{text-align:start}
.auth-msg{
  margin-top:14px; padding:11px 14px; border-radius:var(--r-md);
  background:var(--bad-bg); color:var(--bad); font-size:13px; line-height:1.6;
}
.auth-msg.ok{background:var(--good-bg); color:var(--good)}
.auth-lang{display:block; margin:18px auto 0; font-size:12.5px; background:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ───────── responsive ───────── */
@media (min-width:620px){
  .app{padding-inline:26px}
  .page-title{font-size:44px}
}
@media (max-width:440px){
  .tabbar{gap:4px; padding:8px 9px}
  .tab{width:44px;height:44px}
  .tab[aria-current="page"]{width:56px;height:56px}
}
@media (max-width:359px){
  .tab{width:40px;height:40px}
  .tab[aria-current="page"]{width:50px;height:50px}
  .tiles{gap:11px}
}
</style>
